{% set name = "ads" %}
{% set version = "0.13.0" %}
{% set sha256 = "28b86893f736510493a49051de8eff7543140f34eb0934c62375113ddf84eba4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - test-workaround.patch

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - werkzeug
    - mock
    - requests
    - six

test:
  imports:
    - ads
  commands:
    - pip check
    - pytest --pyargs ads
  requires:
    - pip
    - pytest
    - httpretty
    - python {{ python_min }}

about:
  home: http://github.com/andycasey/ads
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'A Python interface to NASA ADS.'

  description: |
    ads implements a Python interface to NASA ADS's API.
  doc_url: http://ads.readthedocs.io/
  dev_url: https://github.com/andycasey/ads

extra:
  recipe-maintainers:
    - guillochon
    - pkgw
